spring.application.name=slotify

# App Name (logs, actuators)
spring.datasource.url=jdbc:mysql://localhost:3306/slotify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# MySQL login
spring.datasource.username=root
spring.datasource.password=

# To update tables to match Java entity classes (may switch to validate for safer production style)
spring.jpa.hibernate.ddl-auto=update
# To print SQL in the terminal so I can see what the app does to the DB
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HTML templates refresh without restart while I develop
spring.thymeleaf.cache=false